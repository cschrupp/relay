name: Manual Lint Sidecar

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sidecar/1.1-lintfix
      - name: Apply remaining lint-only edits
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('src/relay_engine/persistence/migrations.py')
          text = migration.read_text()
          text = text.replace(
              '        ON github_installation_events(project_id, installation_id, resulting_state_revision, sequence)""",',
              '        ON github_installation_events(\n'
              '            project_id, installation_id, resulting_state_revision, sequence\n'
              '        )""",',
          )
          migration.write_text(text)

          test = Path('tests/unit/test_github_service.py')
          text = test.read_text()
          text = text.replace(
              '    def __init__(self, snapshot: GitHubInstallationSnapshot, repositories=(_repo(),)):\n'
              '        self.snapshot = snapshot\n'
              '        self.repositories = repositories\n',
              '    def __init__(self, snapshot: GitHubInstallationSnapshot, repositories=None):\n'
              '        self.snapshot = snapshot\n'
              '        self.repositories = (_repo(),) if repositories is None else repositories\n',
          )
          text = text.replace(
              'def _service(store, client, webhook_secret=SecretStr("webhook-secret")):\n'
              '    return GitHubIntegrationService(\n',
              'def _service(store, client, webhook_secret=None):\n'
              '    secret = SecretStr("webhook-secret") if webhook_secret is None else webhook_secret\n'
              '    return GitHubIntegrationService(\n',
          )
          text = text.replace('        webhook_secret=webhook_secret,\n', '        webhook_secret=secret,\n', 1)
          test.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/relay_engine/persistence/migrations.py tests/unit/test_github_service.py
          git commit -m "Sidecar: finish Slice 1.1 lint cleanup"
          git push origin HEAD:sidecar/1.1-lintfix
