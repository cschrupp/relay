name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Sync environment
        shell: bash
        run: |
          if [[ -f uv.lock ]]; then
            uv sync --frozen --group dev
          else
            echo "::warning::uv.lock is not committed yet; bootstrapping dependency resolution."
            uv sync --group dev
          fi

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Tests
        run: uv run pytest

      - name: Build
        run: uv build
