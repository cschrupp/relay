name: Lock Sidecar

on:
  push:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.14
      - name: Generate lock
        run: uv lock
      - name: Emit lock
        run: python -c "import base64, pathlib; print('UVLOCK_BASE64=' + base64.b64encode(pathlib.Path('uv.lock').read_bytes()).decode())"
