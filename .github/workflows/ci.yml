name: Lock Sidecar

on:
  push:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.14
      - name: Generate lock
        run: uv lock
      - name: Upload lock
        uses: actions/upload-artifact@v4
        with:
          name: slice-1-1-uv-lock
          path: uv.lock
